name: Build Deeply Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "deeply",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^7.4.0",
              "@capacitor/android": "^7.4.0",
              "@capacitor/app": "^7.0.0",
              "@capacitor/preferences": "^7.0.0",
              "@capgo/capacitor-native-biometric": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.4.0"
            }
          }
          EOF

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vina.deeply",
            "appName": "Deeply",
            "webDir": "www",
            "server": {
              "url": "https://manirahbari20099-ui.github.io/Deeply/",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": false,
              "webContentsDebuggingEnabled": false
            }
          }
          EOF

      - name: Create empty www directory
        run: mkdir -p www && echo "<html><body>Loading...</body></html>" > www/index.html

      - name: Add Android
        run: npx cap add android

      - name: Install extra Capacitor plugins
        run: npm install @capacitor/preferences@^7.0.0 @capacitor/app@^7.0.0

      - name: Inject Biometric Lock into MainActivity
        run: |
          python3 - <<'PY'
          import os
          import re

          base = "android/app/src/main/java"
          main_activity = None

          for root, dirs, files in os.walk(base):
              if "MainActivity.java" in files:
                  main_activity = os.path.join(root, "MainActivity.java")
                  break

          with open(main_activity, "r", encoding="utf-8") as f:
              original = f.read()

          package_match = re.search(r'^\s*package\s+([^;]+);', original, re.MULTILINE)
          package_name = package_match.group(1)

          activity_code = f'''package {package_name};

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{

              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  getWindow().setFlags(
                      WindowManager.LayoutParams.FLAG_FULLSCREEN,
                      WindowManager.LayoutParams.FLAG_FULLSCREEN
                  );
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );

                  WebView webView = getBridge().getWebView();
                  webView.setWebViewClient(new WebViewClient() {{
                      @Override
                      public void onPageFinished(WebView view, String url) {{
                          super.onPageFinished(view, url);

                          String injectJs = "javascript:(async function(){{" +
                              "if (typeof Capacitor === 'undefined') return;" +
                              "var NativeBiometric = Capacitor.Plugins.NativeBiometric;" +
                              "if (!NativeBiometric) return;" +
                              "try {{" +
                              "  var avail = await NativeBiometric.isAvailable();" +
                              "  if (!avail.isAvailable) return;" +
                              "  var lock = document.createElement('div');" +
                              "  lock.style.cssText = 'position:fixed;inset:0;background:#0a140d;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b59561;font-family:Tahoma,sans-serif;text-align:center;padding:20px;';" +
                              "  lock.innerHTML = '<div style=\\\"font-size:5em;margin-bottom:20px;\\\">🔐</div><h2 style=\\\"font-size:1.5em;margin-bottom:10px;color:#f2ebd9;\\\">Deeply</h2><p style=\\\"color:#8a7a63;margin-bottom:30px;\\\">برای ورود هویت خود را تأیید کنید</p><button id=\\\"bio-unlock-btn\\\" style=\\\"background:linear-gradient(135deg,#b59561,#8a7a63);border:none;color:#0a140d;padding:15px 40px;font-size:1.1em;font-weight:700;border-radius:30px;cursor:pointer;font-family:inherit;\\\">🔓 باز کردن قفل</button><p id=\\\"bio-status\\\" style=\\\"color:#666;margin-top:20px;font-size:0.9em;\\\"></p>';" +
                              "  document.body.appendChild(lock);" +
                              "  var status = document.getElementById('bio-status');" +
                              "  async function unlock() {{" +
                              "    try {{" +
                              "      await NativeBiometric.verifyIdentity({{ reason: 'برای ورود به اپ هویت خود را تأیید کنید', title: 'ورود امن', subtitle: 'Deeply', description: 'اثر انگشت خود را روی سنسور قرار دهید' }});" +
                              "      lock.style.transition = 'opacity 0.5s';" +
                              "      lock.style.opacity = '0';" +
                              "      setTimeout(()=>lock.remove(), 500);" +
                              "    }} catch (e) {{ status.textContent = '❌ تأیید نشد. دوباره تلاش کنید.'; }}" +
                              "  }}" +
                              "  unlock();" +
                              "  document.getElementById('bio-unlock-btn').addEventListener('click', unlock);" +
                              "}} catch (e) {{ console.log(e); }}" +
                              "}})();";
                          view.evaluateJavascript(injectJs, null);
                      }}
                  }});
              }}
          }}
          '''

          with open(main_activity, "w", encoding="utf-8") as f:
              f.write(activity_code)
          print("MainActivity with Biometric & Fullscreen created.")
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Set version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Load existing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > Deeply.keystore
          test -s Deeply.keystore
          mkdir -p android/app
          cp Deeply.keystore android/app/Deeply.keystore

      - name: Configure signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ALIAS=$(keytool -list -keystore android/app/Deeply.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep "PrivateKeyEntry" | head -n 1 | cut -d',' -f1 | xargs)
          cat >> android/gradle.properties <<EOF

          DEEPLY_KEYSTORE_FILE=Deeply.keystore
          DEEPLY_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD}
          DEEPLY_KEY_ALIAS=${ALIAS}
          DEEPLY_KEY_PASSWORD=${KEYSTORE_PASSWORD}
          EOF

      - name: Configure Android Gradle
        run: |
          python3 - <<'PY'
          import re
          import os

          path = "android/app/build.gradle"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          text = re.sub(r'applicationId\s+"[^"]+"', 'applicationId "com.vina.deeply"', text, count=1)
          text = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', text, count=1)
          text = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 23', text, count=1)
          text = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', text, count=1)
          text = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["VERSION_CODE"], text, count=1)
          text = re.sub(r'versionName\s+"[^"]+"', 'versionName "' + os.environ["VERSION_NAME"] + '"', text, count=1)

          text = re.sub(r'\n\s*signingConfigs\s*\{.*?\n\s*\}\s*(?=\n\s*buildTypes)', '', text, count=1, flags=re.S)
          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file(DEEPLY_KEYSTORE_FILE)
                      storePassword DEEPLY_KEYSTORE_PASSWORD
                      keyAlias DEEPLY_KEY_ALIAS
                      keyPassword DEEPLY_KEY_PASSWORD
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
          '''
          if "signingConfigs {" not in text:
              text = text.replace("    buildTypes {", signing_block + "    buildTypes {", 1)
          if "signingConfig signingConfigs.release" not in text:
              text = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', r'\1\n            signingConfig signingConfigs.release', text, count=1, flags=re.S)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Add permissions
        run: |
          python3 - <<'PY'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          extras = ""
          for perm in ["android.permission.INTERNET", "android.permission.USE_BIOMETRIC", "android.permission.USE_FINGERPRINT"]:
              if perm not in text:
                  extras += f'    <uses-permission android:name="{perm}" />\n'
          if extras:
              text = text.replace('<application', extras + '    <application', 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Generate default icon
        run: |
          python3 - <<'PY'
          import os
          from PIL import Image, ImageDraw
          size = 1024
          img = Image.new("RGBA", (size, size), (10, 20, 13, 255))
          draw = ImageDraw.Draw(img)
          cx, cy = size // 2, size // 2
          r_outer = int(size * 0.38)
          r_inner = int(size * 0.30)
          draw.ellipse([cx - r_outer, cy - r_outer, cx + r_outer, cy + r_outer], fill=(181, 149, 97, 255))
          draw.ellipse([cx - r_inner, cy - r_inner, cx + r_inner, cy + r_inner], fill=(10, 20, 13, 255))
          img.save("icon.png")

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for density, size in sizes.items():
              folder = "android/app/src/main/res/mipmap-" + density
              os.makedirs(folder, exist_ok=True)
              icon = img.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder + "/ic_launcher.png")
              icon.save(folder + "/ic_launcher_round.png")
              icon.save(folder + "/ic_launcher_foreground.png")
          PY
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon

      - name: Prepare release
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/Deeply.apk

      - name: Upload release
        uses: actions/upload-artifact@v6
        with:
          name: Deeply-v${{ env.VERSION_NAME }}
          path: release/
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          rm -f Deeply.keystore
          rm -f android/app/Deeply.keystore
